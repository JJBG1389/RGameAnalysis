name: FTC 2026 raw data collection
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch FTC event records (bounded)
        run: python scripts/collect_2026_season.py --program FTC --limit 250 --output-dir collected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftc-2026-raw-data
          path: collected/
          retention-days: 30
